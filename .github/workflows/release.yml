name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $asset = Join-Path $env:RUNNER_TEMP "Sword-Shield-Chronicle_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          $notes = "Windows x64 installer`n`nSHA256: ``$hash``"
          gh release create "$env:GITHUB_REF_NAME" $asset --title "剑盾纪事 $env:GITHUB_REF_NAME" --notes $notes
