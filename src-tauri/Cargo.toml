[package]
name = "sword-shield-notes"
version = "0.1.0"
description = "A passive, local-first sword-and-shield task board for Windows"
authors = ["Sword Shield Chronicle contributors"]
license = "MIT"
repository = "https://github.com/wp-i/sword-shield-chronicle"
edition = "2024"

[lib]
name = "sword_shield_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
